version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: siminfra_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: siminfra_db
      MYSQL_USER: siminfra_user
      MYSQL_PASSWORD: siminfra_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: